---
name: Release WebApp

on:
  # Release WebApp is intentionally started explicitly. Branch preparation and
  # the complete release lifecycle are one auditable workflow operation.
  workflow_dispatch:
    inputs:
      operation:
        description: 'Start the next SemVer release or continue the active release'
        required: true
        type: choice
        options:
          - start
          - continue
      confirm_release:
        description: 'I understand that this creates or reuses the release branch, automatically deploys and verifies Beta, runs the blocking E2E gate, and then waits for separate Production approval before deploying Production and creating a draft GitHub Release for manual changelog completion and publication'
        required: true
        default: false
        type: boolean
      reason:
        description: 'Optional reason for this WebApp release operation'
        required: false
        type: string

concurrency:
  group: release-webapp
  cancel-in-progress: false
  queue: max

permissions: {}

env:
  AWS_REGION: eu-central-1
  ARTIFACT_PATH: apps/server/dist/s3/ebs.zip
  # Retain this legacy artifact prefix so previous release runs remain repairable.
  BETA_ARTIFACT_NAME_PREFIX: release-cloud-ebs
  BETA_RUNTIME_BACKEND_REST: https://prod-nginz-https.wire.com
  BETA_RUNTIME_BACKEND_WS: wss://prod-nginz-ssl.wire.com
  CHART_REPOSITORY_URL: s3://public.wire.com/charts-webapp
  DOCKER_REPOSITORY: quay.io/wire/webapp
  E2E_RUNTIME_BACKEND_REST: https://staging-nginz-https.zinfra.io/
  E2E_RUNTIME_BACKEND_WS: wss://staging-nginz-ssl.zinfra.io/
  PRODUCTION_WEBAPP_URL: https://app.wire.com/
  PRODUCTION_RUNTIME_BACKEND_REST: https://prod-nginz-https.wire.com
  PRODUCTION_RUNTIME_BACKEND_WS: wss://prod-nginz-ssl.wire.com
  # ADR 0002 calls this logical release stage Beta. Its GitHub Environment and
  # canonical company-facing URL use wire-webapp-beta, while deployments retain
  # the existing wire-webapp-staging Elastic Beanstalk environment.
  BETA_ELASTIC_BEANSTALK_ENVIRONMENT_NAME: wire-webapp-staging
  BETA_WEBAPP_URL: https://wire-webapp-beta.wire.com/
  E2E_ELASTIC_BEANSTALK_ENVIRONMENT_NAME: wire-webapp-precommit-3
  E2E_WEBAPP_URL: https://wire-webapp-precommit-3.zinfra.io/
  PRODUCTION_ENVIRONMENT_NAME: wire-webapp-prod
  WIRE_BUILDS_REPOSITORY: wireapp/wire-builds

jobs:
  prepare_release:
    name: Prepare SemVer release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create the create-only SemVer release branch reservation.
      pull-requests: read # Read merged PR labels used to calculate the version.
    outputs:
      operation: ${{ steps.prepare.outputs.operation }}
      release_version: ${{ steps.prepare.outputs.release_version }}
      release_branch: ${{ steps.prepare.outputs.release_branch }}
      release_commit_sha: ${{ steps.prepare.outputs.release_commit_sha }}
      release_branch_action: ${{ steps.prepare.outputs.release_branch_action }}
      stable_base_version: ${{ steps.prepare.outputs.stable_base_version }}
      stable_base_tag: ${{ steps.prepare.outputs.stable_base_tag }}
      stable_base_commit_sha: ${{ steps.prepare.outputs.stable_base_commit_sha }}

    steps:
      - name: Checkout release planning history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Validate release request
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo 'Release WebApp must be started with "Use workflow from: main".' >&2
            echo "Received workflow ref: ${GITHUB_REF}" >&2
            exit 1
          fi

          if [[ "${CONFIRM_RELEASE}" != 'true' ]]; then
            echo 'confirm_release must be true to start or continue a WebApp release.' >&2
            exit 1
          fi

      - name: Add repository Yarn wrapper to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install release tooling dependencies
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: ./bin/yarn install --immutable --mode=skip-build

      - name: Prepare release branch and version
        id: prepare
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail

          if [[ "${RELEASE_OPERATION}" == 'start' ]]; then
            preparation_output="$(node ./tools/release-cli/webappRelease.mts start "${GITHUB_SHA}")"
          elif [[ "${RELEASE_OPERATION}" == 'continue' ]]; then
            preparation_output="$(node ./tools/release-cli/webappRelease.mts continue)"
          else
            echo "Unknown release operation: ${RELEASE_OPERATION}" >&2
            exit 1
          fi

          {
            echo "operation=$(jq --raw-output '.operation' <<< "${preparation_output}")"
            echo "release_version=$(jq --raw-output '.version' <<< "${preparation_output}")"
            echo "release_branch=$(jq --raw-output '.release_branch' <<< "${preparation_output}")"
            echo "release_commit_sha=$(jq --raw-output '.release_commit' <<< "${preparation_output}")"
            echo "release_branch_action=$(jq --raw-output '.release_branch_action' <<< "${preparation_output}")"
            echo "stable_base_version=$(jq --raw-output '.stable_base_version' <<< "${preparation_output}")"
            echo "stable_base_tag=$(jq --raw-output '.stable_base_tag' <<< "${preparation_output}")"
            echo "stable_base_commit_sha=$(jq --raw-output '.stable_base_commit' <<< "${preparation_output}")"
          } >> "$GITHUB_OUTPUT"

  build_artifact:
    name: Build release artifact
    runs-on: ubuntu-24.04
    needs: prepare_release
    env:
      WIRE_WEBAPP_CONFIGURATION: production
    permissions:
      contents: read
    outputs:
      artifact_checksum: ${{ steps.artifact_metadata.outputs.artifact_checksum }}
      artifact_name: ${{ steps.artifact_metadata.outputs.artifact_name }}
      artifact_version: ${{ steps.validate_artifact_metadata.outputs.artifact_version }}
      artifact_asset_version: ${{ steps.validate_artifact_metadata.outputs.artifact_asset_version }}
      artifact_commit: ${{ steps.validate_artifact_metadata.outputs.artifact_commit }}
      artifact_built_at: ${{ steps.validate_artifact_metadata.outputs.artifact_built_at }}
      distribution_artifact_name: ${{ steps.distribution_artifact.outputs.distribution_artifact_name }}
      release_branch: ${{ steps.release_metadata.outputs.release_branch }}
      operation: ${{ needs.prepare_release.outputs.operation }}
      release_branch_action: ${{ needs.prepare_release.outputs.release_branch_action }}
      release_commit_sha: ${{ steps.release_metadata.outputs.release_commit_sha }}
      release_version: ${{ steps.release_metadata.outputs.release_version }}
      stable_base_version: ${{ needs.prepare_release.outputs.stable_base_version }}
      stable_base_tag: ${{ needs.prepare_release.outputs.stable_base_tag }}
      stable_base_commit_sha: ${{ needs.prepare_release.outputs.stable_base_commit_sha }}

    steps:
      - name: Checkout prepared release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.prepare_release.outputs.release_commit_sha }}

      - name: Add repository Yarn wrapper to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: ./bin/yarn --immutable

      - name: Verify prepared release commit
        id: release_metadata
        env:
          EXPECTED_RELEASE_COMMIT_SHA: ${{ needs.prepare_release.outputs.release_commit_sha }}
          RELEASE_BRANCH: ${{ needs.prepare_release.outputs.release_branch }}
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.release_version }}
        run: |
          set -euo pipefail

          release_commit_sha="$(git rev-parse HEAD)"

          if [[ "${release_commit_sha}" != "${EXPECTED_RELEASE_COMMIT_SHA}" ]]; then
            echo "Checked out ${release_commit_sha}, expected prepared release commit ${EXPECTED_RELEASE_COMMIT_SHA}." >&2
            exit 1
          fi

          {
            echo "release_branch=${RELEASE_BRANCH}"
            echo "release_version=${RELEASE_VERSION}"
            echo "release_commit_sha=${EXPECTED_RELEASE_COMMIT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Update configuration
        run: ./bin/yarn nx run webapp:configure

      - name: Build and package public production
        env:
          WIRE_WEBAPP_BUILD_COMMIT: ${{ steps.release_metadata.outputs.release_commit_sha }}
          WIRE_WEBAPP_BUILD_VERSION: ${{ steps.release_metadata.outputs.release_version }}
        run: ./bin/yarn build:prod:public

      - name: Validate release artifact metadata
        id: validate_artifact_metadata
        env:
          BUILD_ARTIFACT_PATH: ${{ env.ARTIFACT_PATH }}
          EXPECTED_COMMIT: ${{ steps.release_metadata.outputs.release_commit_sha }}
          EXPECTED_VERSION: ${{ steps.release_metadata.outputs.release_version }}
        run: node ./tools/build-artifact/validateBuildArtifact.mts

      - name: Compute artifact metadata
        id: artifact_metadata
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.release_version }}
        run: |
          set -euo pipefail

          artifact_name="${BETA_ARTIFACT_NAME_PREFIX}-${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_checksum="$(sha256sum "${ARTIFACT_PATH}" | awk '{print $1}')"

          {
            echo "artifact_name=${artifact_name}"
            echo "artifact_checksum=${artifact_checksum}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare exact public Docker distribution context
        id: distribution_artifact
        env:
          ARTIFACT_CHECKSUM: ${{ steps.artifact_metadata.outputs.artifact_checksum }}
          ARTIFACT_VERSION: ${{ steps.validate_artifact_metadata.outputs.artifact_version }}
          RELEASE_COMMIT_SHA: ${{ steps.release_metadata.outputs.release_commit_sha }}
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.release_version }}
        run: |
          set -euo pipefail

          # Retain this legacy artifact prefix so previous release runs remain repairable.
          distribution_artifact_name="release-cloud-distribution-context-${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          distribution_context_directory="${RUNNER_TEMP}/${distribution_artifact_name}"
          mkdir -p \
            "${distribution_context_directory}/apps/server" \
            "${distribution_context_directory}/libraries/config" \
            "${distribution_context_directory}/bin"

          cp -a package.json yarn.lock .yarnrc.yml .npmrc run.sh .env.defaults "${distribution_context_directory}/"
          cp -a .yarn "${distribution_context_directory}/.yarn"
          cp -a bin/yarn "${distribution_context_directory}/bin/yarn"
          cp -a apps/server/Dockerfile apps/server/package.json "${distribution_context_directory}/apps/server/"
          cp -a apps/server/dist "${distribution_context_directory}/apps/server/dist"
          cp -a libraries/config/package.json libraries/config/lib "${distribution_context_directory}/libraries/config/"

          jq -n \
            --arg release_version "${RELEASE_VERSION}" \
            --arg release_commit_sha "${RELEASE_COMMIT_SHA}" \
            --arg artifact_version "${ARTIFACT_VERSION}" \
            --arg cloud_artifact_checksum "${ARTIFACT_CHECKSUM}" \
            --arg source_run_id "${GITHUB_RUN_ID}" \
            --arg source_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{
              productionTag: null,
              releaseIdentifier: $release_version,
              releaseCommitSha: $release_commit_sha,
              artifactVersion: $artifact_version,
              cloudArtifactChecksum: $cloud_artifact_checksum,
              sourceRunId: $source_run_id,
              sourceRunAttempt: $source_run_attempt
            }' > "${distribution_context_directory}/distribution-manifest.json"

          echo "distribution_artifact_name=${distribution_artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Upload exact public Docker distribution context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.distribution_artifact.outputs.distribution_artifact_name }}
          path: ${{ runner.temp }}/${{ steps.distribution_artifact.outputs.distribution_artifact_name }}
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact_metadata.outputs.artifact_name }}
          path: ${{ env.ARTIFACT_PATH }}

  deploy_to_beta:
    name: Deploy to Beta
    runs-on: ubuntu-24.04
    needs: build_artifact
    permissions:
      contents: read
    concurrency:
      group: deploy-webapp-beta
      cancel-in-progress: false
      queue: max
    environment:
      name: wire-webapp-beta
      url: https://wire-webapp-beta.wire.com/

    outputs:
      runtime_verification_result: ${{ steps.verify_beta_runtime.outcome }}

    steps:
      - name: Checkout runtime verification action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js for runtime verification
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build_artifact.outputs.artifact_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          aws-access-key-id: ${{ secrets.WEBTEAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WEBTEAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Beta
        id: deploy
        uses: aws-actions/aws-elasticbeanstalk-deploy@1f56e4e813ae4eb167e69ca324234c336c1df573
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: Webapp
          environment-name: ${{ env.BETA_ELASTIC_BEANSTALK_ENVIRONMENT_NAME }}
          version-label: ${{ needs.build_artifact.outputs.release_version }}-${{ github.run_id }}-${{ github.run_attempt }}-beta
          deployment-package-path: ebs.zip
          wait-for-deployment: true
          wait-for-environment-recovery: true
          deployment-timeout: 150
          use-existing-application-version-if-available: true

      - name: Verify Beta runtime
        id: verify_beta_runtime
        uses: ./.github/actions/verify-webapp-runtime
        with:
          environment-label: Beta
          webapp-url: ${{ env.BETA_WEBAPP_URL }}
          expected-version: ${{ needs.build_artifact.outputs.artifact_version }}
          expected-asset-version: ${{ needs.build_artifact.outputs.artifact_asset_version }}
          expected-commit: ${{ needs.build_artifact.outputs.artifact_commit }}
          expected-built-at: ${{ needs.build_artifact.outputs.artifact_built_at }}
          expected-backend-rest: ${{ env.BETA_RUNTIME_BACKEND_REST }}
          expected-backend-ws: ${{ env.BETA_RUNTIME_BACKEND_WS }}

  create_beta_tag:
    name: Create Beta tag
    runs-on: ubuntu-24.04
    needs: [build_artifact, deploy_to_beta]
    permissions:
      contents: write # Create the immutable annotated Beta tag.
    outputs:
      beta_tag_name: ${{ steps.beta_tag.outputs.beta_tag_name }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          ref: ${{ needs.build_artifact.outputs.release_commit_sha }}

      - name: Add repository Yarn wrapper to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: ./bin/yarn install --immutable --mode=skip-build

      - name: Create and push Beta tag
        id: beta_tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_SHA: ${{ needs.build_artifact.outputs.release_commit_sha }}
          RELEASE_VERSION: ${{ needs.build_artifact.outputs.release_version }}
        run: |
          set -euo pipefail

          git_authentication_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 --wrap=0)"
          run_authenticated_git() {
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="${git_authentication_header}" \
              git "$@"
          }

          mapfile -t existing_beta_tag_names < <(
            run_authenticated_git ls-remote \
              --tags \
              --refs \
              origin \
              "v${RELEASE_VERSION}-beta.*" |
              awk '{
                sub("^refs/tags/", "", $2);
                print $2;
              }'
          )
          beta_tag_name="$(node ./tools/release-cli/releaseMetadataCli.mts next-beta-tag "${RELEASE_VERSION}" "${existing_beta_tag_names[@]}")"

          git config user.email "zebot@users.noreply.github.com"
          git config user.name "Zebot"
          git tag --annotate "$beta_tag_name" --message "Release $beta_tag_name" "$RELEASE_COMMIT_SHA"
          run_authenticated_git push origin "refs/tags/$beta_tag_name"
          unset git_authentication_header

          echo "beta_tag_name=${beta_tag_name}" >> "$GITHUB_OUTPUT"

  notify_beta_release_success:
    name: Notify successful Beta release
    runs-on: ubuntu-24.04
    needs: [build_artifact, deploy_to_beta, create_beta_tag]
    if: >-
      ${{
        always() &&
        needs.deploy_to_beta.result == 'success' &&
        needs.create_beta_tag.result == 'success'
      }}
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout notification action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Announce successful Beta release
        uses: ./.github/actions/notify-deployoholics
        with:
          deployoholics-webhook-url: ${{ secrets.WIRE_DEPLOYOHOLICS_WEBHOOK_URL }}
          deployoholics-token: ${{ secrets.WIRE_DEPLOYOHOLICS_TOKEN }}
          text: |
            ✅ WebApp Beta release successfully deployed ✅

            Release: ${{ needs.build_artifact.outputs.release_version }}
            Branch: ${{ needs.build_artifact.outputs.release_branch }}
            Release commit SHA: ${{ needs.build_artifact.outputs.release_commit_sha }}
            Beta tag: ${{ needs.create_beta_tag.outputs.beta_tag_name }}
            Beta URL: ${{ env.BETA_WEBAPP_URL }}
            Beta deployment result: ${{ needs.deploy_to_beta.result }}
            Beta runtime-verification result: ${{ needs.deploy_to_beta.outputs.runtime_verification_result }}
            Beta tag creation result: ${{ needs.create_beta_tag.result }}
            Triggering actor: ${{ github.actor }}
            Workflow-run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  comment_beta_release_appearances:
    name: Comment Beta release appearances
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build_artifact, create_beta_tag]
    if: ${{ needs.create_beta_tag.result == 'success' }}
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # required to create and update release-appearance comments

    steps:
      - name: Checkout release history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Add repository Yarn wrapper to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: ./bin/yarn install --immutable --mode=skip-build

      - name: Add Beta release appearance comments
        env:
          BETA_TAG: ${{ needs.create_beta_tag.outputs.beta_tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_SHA: ${{ needs.build_artifact.outputs.release_commit_sha }}
          WORKFLOW_TOOLING_COMMIT_SHA: ${{ github.sha }}
        run: |
          node \
            tools/release-cli/releaseAppearanceCommand.mts \
            beta \
            "${BETA_TAG}" \
            "${RELEASE_COMMIT_SHA}"

  summarize_beta_release:
    name: Summarize Beta release
    runs-on: ubuntu-24.04
    needs:
      - build_artifact
      - deploy_to_beta
      - create_beta_tag
    if: ${{ always() }}
    permissions:
      contents: read

    steps:
      - name: Checkout WebApp release summary renderer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Add repository Yarn wrapper to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install renderer dependencies
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: ./bin/yarn install --immutable

      - name: Add Beta release summary
        env:
          ARTIFACT_CHECKSUM: ${{ needs.build_artifact.outputs.artifact_checksum }}
          ARTIFACT_BUILT_AT: ${{ needs.build_artifact.outputs.artifact_built_at }}
          ARTIFACT_ASSET_VERSION: ${{ needs.build_artifact.outputs.artifact_asset_version }}
          ARTIFACT_NAME: ${{ needs.build_artifact.outputs.artifact_name }}
          ARTIFACT_VERSION: ${{ needs.build_artifact.outputs.artifact_version }}
          BETA_RESULT: ${{ needs.deploy_to_beta.result }}
          BETA_ELASTIC_BEANSTALK_ENVIRONMENT_NAME: ${{ env.BETA_ELASTIC_BEANSTALK_ENVIRONMENT_NAME }}
          BETA_RUNTIME_BACKEND_REST: ${{ env.BETA_RUNTIME_BACKEND_REST }}
          BETA_RUNTIME_BACKEND_WS: ${{ env.BETA_RUNTIME_BACKEND_WS }}
          BETA_RUNTIME_VERIFICATION_RESULT: ${{ needs.deploy_to_beta.outputs.runtime_verification_result }}
          BETA_TAG_CREATION_RESULT: ${{ needs.create_beta_tag.result }}
          BETA_TAG_NAME: ${{ needs.create_beta_tag.outputs.beta_tag_name }}
          BETA_WEBAPP_URL: ${{ env.BETA_WEBAPP_URL }}
          RELEASE_OPERATION: ${{ needs.build_artifact.outputs.operation }}
          RELEASE_BRANCH: ${{ needs.build_artifact.outputs.release_branch }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_BRANCH_ACTION: ${{ needs.build_artifact.outputs.release_branch_action }}
          RELEASE_COMMIT_SHA: ${{ needs.build_artifact.outputs.release_commit_sha }}
          RELEASE_VERSION: ${{ needs.build_artifact.outputs.release_version }}
          RELEASE_REASON: ${{ inputs.reason }}
        run: node tools/release-summary/renderWebappReleaseSummary.ts --beta-release >> "$GITHUB_STEP_SUMMARY"

  # WebApp release owns release-specific success and failure notifications.
  # The reusable workflow's optional failure-only notification is intentionally
  # not enabled here to prevent duplicate failure messages.
  run_e2e:
    name: Deploy to precommit and run E2E
    needs: [build_artifact, create_beta_tag]
    permissions:
      contents: read
    uses: ./.github/workflows/precommit-slot-run.yml
    with:
      env_name: wire-webapp-precommit-3
      teamManagementUrl: https://teams.wire.com/login/
      artifact_name: ${{ needs.build_artifact.outputs.artifact_name }}
      expectedBackendRest: https://staging-nginz-https.zinfra.io/
      expectedBackendWs: wss://staging-nginz-ssl.zinfra.io/
      expectedVersion: ${{ needs.build_artifact.outputs.artifact_version }}
      expectedCommit: ${{ needs.build_artifact.outputs.artifact_commit }}
      grep: '@regression|@crit-flow-web'
      testinyRunName: Release ${{ needs.build_artifact.outputs.release_version }} ${{ needs.create_beta_tag.outputs.beta_tag_name }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      WEBTEAM_AWS_ACCESS_KEY_ID: ${{ secrets.WEBTEAM_AWS_ACCESS_KEY_ID }}
      WEBTEAM_AWS_SECRET_ACCESS_KEY: ${{ secrets.WEBTEAM_AWS_SECRET_ACCESS_KEY }}
      TESTINY_API_KEY: ${{ secrets.TESTINY_API_KEY }}

  notify_e2e_success:
    name: Notify successful release E2E gate
    runs-on: ubuntu-24.04
    needs:
      - build_artifact
      - create_beta_tag
      - run_e2e
      - production_preflight
    if: >-
      ${{
        always() &&
        needs.run_e2e.result == 'success' &&
        needs.production_preflight.result == 'success'
      }}
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout notification action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Announce successful release E2E gate
        uses: ./.github/actions/notify-deployoholics
        with:
          deployoholics-webhook-url: ${{ secrets.WIRE_DEPLOYOHOLICS_WEBHOOK_URL }}
          deployoholics-token: ${{ secrets.WIRE_DEPLOYOHOLICS_TOKEN }}
          text: |
            ✅ Release E2E system gate passed ✅

            Release: ${{ needs.build_artifact.outputs.release_version }}
            Branch: ${{ needs.build_artifact.outputs.release_branch }}
            Commit: ${{ needs.build_artifact.outputs.release_commit_sha }}
            Beta tag: ${{ needs.create_beta_tag.outputs.beta_tag_name }}
            E2E system gate: ${{ needs.run_e2e.result }}
            Production preflight: ${{ needs.production_preflight.outputs.production_preflight_result }}
            Production deployment required: ${{ needs.production_preflight.outputs.should_deploy }}
            Playwright report: ${{ needs.run_e2e.outputs.reportUrl || 'unavailable' }}
            Workflow URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ${{
              needs.production_preflight.outputs.should_deploy == 'true' &&
              'Production is ready for approval through the wire-webapp-prod GitHub Environment.' ||
              format(
                'Production deployment is not required: {0}',
                needs.production_preflight.outputs.production_skipped_reason
              )
            }}

  production_preflight:
    name: Production preflight
    runs-on: ubuntu-24.04
    needs: [build_artifact, create_beta_tag, run_e2e]
    permissions:
      contents: read
    outputs:
      production_preflight_result: ${{ steps.production_preflight.outputs.production_preflight_result }}
      production_skipped_reason: ${{ steps.production_preflight.outputs.production_skipped_reason }}
      production_tag_name: ${{ steps.production_preflight.outputs.production_tag_name }}
      should_deploy: ${{ steps.production_preflight.outputs.should_deploy }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.build_artifact.outputs.release_commit_sha }}

      - name: Add repository Yarn wrapper to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: ./bin/yarn install --immutable --mode=skip-build

      - name: Check Production promotion eligibility
        id: production_preflight
        env:
          BETA_TAG_NAME: ${{ needs.create_beta_tag.outputs.beta_tag_name }}
          RELEASE_COMMIT_SHA: ${{ needs.build_artifact.outputs.release_commit_sha }}
          RELEASE_VERSION: ${{ needs.build_artifact.outputs.release_version }}
        run: |
          set -euo pipefail

          git fetch --tags origin

          production_tag_name="v${RELEASE_VERSION}"
          node ./tools/release-cli/releaseMetadataCli.mts validate-webapp-beta-tag "${BETA_TAG_NAME}" "${RELEASE_VERSION}" > /dev/null
          node ./tools/release-cli/releaseMetadataCli.mts validate-stable-webapp-tag "${production_tag_name}" > /dev/null

          if [[ "$(git cat-file -t "refs/tags/${BETA_TAG_NAME}")" != 'tag' ]]; then
            echo "Beta tag ${BETA_TAG_NAME} must be annotated." >&2
            exit 1
          fi

          beta_tag_commit_sha="$(git rev-parse "${BETA_TAG_NAME}^{commit}")"

          if [[ "${beta_tag_commit_sha}" != "${RELEASE_COMMIT_SHA}" ]]; then
            echo "Beta tag ${BETA_TAG_NAME} points to ${beta_tag_commit_sha}, expected ${RELEASE_COMMIT_SHA}." >&2
            exit 1
          fi

          if git rev-parse --quiet --verify "refs/tags/${production_tag_name}" >/dev/null; then
            if [[ "$(git cat-file -t "refs/tags/${production_tag_name}")" != 'tag' ]]; then
              echo "Production tag ${production_tag_name} must be annotated." >&2
              exit 1
            fi

            production_tag_commit_sha="$(git rev-parse "${production_tag_name}^{commit}")"

            if [[ "${production_tag_commit_sha}" != "${RELEASE_COMMIT_SHA}" ]]; then
              echo "Production tag ${production_tag_name} points to ${production_tag_commit_sha}, expected ${RELEASE_COMMIT_SHA}." >&2
              exit 1
            fi

            production_skipped_reason="Release is already tagged as Production with ${production_tag_name}"

            {
              echo 'should_deploy=false'
              echo 'production_preflight_result=already_tagged'
              echo "production_skipped_reason=${production_skipped_reason}"
              echo "production_tag_name=${production_tag_name}"
            } >> "$GITHUB_OUTPUT"

            exit 0
          fi

          {
            echo 'should_deploy=true'
            echo 'production_preflight_result=ready'
            echo 'production_skipped_reason='
            echo "production_tag_name=${production_tag_name}"
          } >> "$GITHUB_OUTPUT"

  production_approval:
    name: Approve Production deployment
    runs-on: ubuntu-24.04
    needs: production_preflight
    if: ${{ needs.production_preflight.outputs.should_deploy == 'true' }}
    permissions: {}
    # This job is the approval gate only. The Deploy to Production job below
    # is the non-cancellable Production operation boundary.
    environment: wire-webapp-prod
    steps:
      - name: Record Production approval
        run: echo 'Production approval granted; the non-cancellable deployment job may start.'

  deploy_to_production:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    needs: [build_artifact, production_preflight, production_approval]
    if: >-
      ${{
        needs.production_preflight.outputs.should_deploy == 'true' &&
        needs.production_approval.result == 'success'
      }}
    permissions:
      contents: read
    outputs:
      current_beta_verification_result: ${{ steps.verify_current_beta.outcome }}
    concurrency:
      group: deploy-webapp-production
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout runtime verification action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Setup Node.js for runtime verification
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'

      - name: Verify current Beta runtime
        id: verify_current_beta
        uses: ./.github/actions/verify-webapp-runtime
        with:
          environment-label: Current Beta before Production promotion
          webapp-url: ${{ env.BETA_WEBAPP_URL }}
          expected-version: ${{ needs.build_artifact.outputs.artifact_version }}
          expected-asset-version: ${{ needs.build_artifact.outputs.artifact_asset_version }}
          expected-commit: ${{ needs.build_artifact.outputs.artifact_commit }}
          expected-built-at: ${{ needs.build_artifact.outputs.artifact_built_at }}
          expected-backend-rest: ${{ env.BETA_RUNTIME_BACKEND_REST }}
          expected-backend-ws: ${{ env.BETA_RUNTIME_BACKEND_WS }}

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build_artifact.outputs.artifact_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          aws-access-key-id: ${{ secrets.WEBTEAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WEBTEAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Production
        id: deploy
        uses: aws-actions/aws-elasticbeanstalk-deploy@1f56e4e813ae4eb167e69ca324234c336c1df573
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: Webapp
          environment-name: ${{ env.PRODUCTION_ENVIRONMENT_NAME }}
          version-label: ${{ needs.build_artifact.outputs.release_version }}-${{ github.run_id }}-${{ github.run_attempt }}-prod
          deployment-package-path: ebs.zip
          wait-for-deployment: true
          wait-for-environment-recovery: true
          deployment-timeout: 150
          use-existing-application-version-if-available: true

  verify_production_runtime:
    name: Verify Production runtime
    runs-on: ubuntu-24.04
    needs: [build_artifact, deploy_to_production]
    if: ${{ needs.deploy_to_production.result == 'success' }}
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout runtime verification action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js for runtime verification
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'

      - name: Verify Production runtime
        uses: ./.github/actions/verify-webapp-runtime
        with:
          environment-label: Production
          webapp-url: ${{ env.PRODUCTION_WEBAPP_URL }}
          expected-version: ${{ needs.build_artifact.outputs.artifact_version }}
          expected-asset-version: ${{ needs.build_artifact.outputs.artifact_asset_version }}
          expected-commit: ${{ needs.build_artifact.outputs.artifact_commit }}
          expected-built-at: ${{ needs.build_artifact.outputs.artifact_built_at }}
          expected-backend-rest: ${{ env.PRODUCTION_RUNTIME_BACKEND_REST }}
          expected-backend-ws: ${{ env.PRODUCTION_RUNTIME_BACKEND_WS }}

  create_production_tag:
    name: Create Production tag
    runs-on: ubuntu-24.04
    needs: [build_artifact, production_preflight, deploy_to_production, verify_production_runtime]
    if: ${{ needs.production_preflight.outputs.should_deploy == 'true' && needs.deploy_to_production.result == 'success' && needs.verify_production_runtime.result == 'success' }}
    permissions:
      contents: write # Create the immutable stable Production tag.
    outputs:
      production_tag_name: ${{ steps.production_tag.outputs.production_tag_name }}
      production_tag_action: ${{ steps.production_tag.outputs.production_tag_action }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.build_artifact.outputs.release_commit_sha }}

      - name: Create and push Production tag
        id: production_tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_TAG_NAME: ${{ needs.production_preflight.outputs.production_tag_name }}
          RELEASE_COMMIT_SHA: ${{ needs.build_artifact.outputs.release_commit_sha }}
        run: |
          set -euo pipefail

          git_authentication_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 --wrap=0)"
          run_authenticated_git() {
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="${git_authentication_header}" \
              git "$@"
          }

          existing_production_tag_ref="$(
            run_authenticated_git ls-remote \
              --tags \
              origin \
              "refs/tags/${PRODUCTION_TAG_NAME}"
          )"

          if [[ -n "${existing_production_tag_ref}" ]]; then
            run_authenticated_git fetch \
              --no-tags \
              --depth=1 \
              origin \
              "refs/tags/${PRODUCTION_TAG_NAME}:refs/tags/${PRODUCTION_TAG_NAME}"

            if [[ "$(git cat-file -t "refs/tags/${PRODUCTION_TAG_NAME}")" != 'tag' ]]; then
              echo "Production tag ${PRODUCTION_TAG_NAME} must be annotated." >&2
              exit 1
            fi

            existing_production_tag_commit_sha="$(git rev-parse "${PRODUCTION_TAG_NAME}^{commit}")"
            if [[ "${existing_production_tag_commit_sha}" != "${RELEASE_COMMIT_SHA}" ]]; then
              echo "Production tag ${PRODUCTION_TAG_NAME} points to ${existing_production_tag_commit_sha}, expected ${RELEASE_COMMIT_SHA}." >&2
              exit 1
            fi

            {
              echo "production_tag_name=${PRODUCTION_TAG_NAME}"
              echo 'production_tag_action=already_tagged'
            } >> "$GITHUB_OUTPUT"

            unset git_authentication_header

            exit 0
          fi

          git config user.email "zebot@users.noreply.github.com"
          git config user.name "Zebot"
          git tag --annotate "$PRODUCTION_TAG_NAME" --message "Release $PRODUCTION_TAG_NAME" "$RELEASE_COMMIT_SHA"
          run_authenticated_git push origin "refs/tags/$PRODUCTION_TAG_NAME"
          unset git_authentication_header

          {
            echo "production_tag_name=${PRODUCTION_TAG_NAME}"
            echo 'production_tag_action=created'
          } >> "$GITHUB_OUTPUT"

  comment_production_release_appearances:
    name: Comment Production release appearances
    runs-on: ubuntu-24.04
    needs: [build_artifact, create_beta_tag, create_production_tag]
    if: ${{ needs.create_production_tag.result == 'success' }}
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # required to create and update release-appearance comments

    steps:
      - name: Checkout release history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Add repository Yarn wrapper to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: ./bin/yarn install --immutable --mode=skip-build

      - name: Add Production release appearance comments
        env:
          BETA_TAG: ${{ needs.create_beta_tag.outputs.beta_tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_TAG: ${{ needs.create_production_tag.outputs.production_tag_name }}
          RELEASE_COMMIT_SHA: ${{ needs.build_artifact.outputs.release_commit_sha }}
          WORKFLOW_TOOLING_COMMIT_SHA: ${{ github.sha }}
        run: |
          node \
            tools/release-cli/releaseAppearanceCommand.mts \
            production \
            "${PRODUCTION_TAG}" \
            "${RELEASE_COMMIT_SHA}" \
            "${BETA_TAG}"

  publish_production_distribution:
    name: Publish Production distribution
    needs: [build_artifact, create_production_tag]
    if: ${{ needs.create_production_tag.result == 'success' }}
    permissions:
      actions: read # Download the exact source release artifact.
      contents: read # Fetch the immutable Production tag for validation.
    uses: ./.github/workflows/publish-production-distribution.yml
    with:
      production_tag: ${{ needs.create_production_tag.outputs.production_tag_name }}
      expected_commit_sha: ${{ needs.build_artifact.outputs.release_commit_sha }}
      source_run_id: ${{ github.run_id }}
      distribution_artifact_name: ${{ needs.build_artifact.outputs.distribution_artifact_name }}
    secrets:
      WEBTEAM_QUAY_USERNAME: ${{ secrets.WEBTEAM_QUAY_USERNAME }}
      WEBTEAM_QUAY_PASSWORD: ${{ secrets.WEBTEAM_QUAY_PASSWORD }}
      CHARTS_WEBAPP_AUTOMATION_AWS_ACCESS_KEY_ID: ${{ secrets.CHARTS_WEBAPP_AUTOMATION_AWS_ACCESS_KEY_ID }}
      CHARTS_WEBAPP_AUTOMATION_AWS_SECRET_ACCESS_KEY: ${{ secrets.CHARTS_WEBAPP_AUTOMATION_AWS_SECRET_ACCESS_KEY }}
      WIRE_BUILDS_WRITE_ACCESS_GH_TOKEN: ${{ secrets.WIRE_BUILDS_WRITE_ACCESS_GH_TOKEN }}

  ensure_github_release:
    name: Ensure GitHub Release draft
    runs-on: ubuntu-24.04
    # This job is intentionally independent of Production distribution. Both
    # jobs consume the immutable Production tag, so a GitHub metadata failure
    # must not prevent Docker, Helm or wire-builds publication.
    needs: [production_preflight, create_production_tag]
    if: >-
      ${{
        always() &&
        needs.production_preflight.result == 'success' &&
        (
          needs.create_production_tag.result == 'success' ||
          needs.production_preflight.outputs.production_preflight_result == 'already_tagged'
        )
      }}
    permissions:
      contents: write # Create and update the draft for the stable Production tag.
    outputs:
      production_tag_name: ${{ steps.ensure_github_release.outputs.production_tag_name }}
      github_release_action: ${{ steps.ensure_github_release.outputs.github_release_action }}
      github_release_state: ${{ steps.ensure_github_release.outputs.github_release_state }}
      github_release_url: ${{ steps.ensure_github_release.outputs.github_release_url }}

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Add repository Yarn wrapper to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: ./bin/yarn install --immutable --mode=skip-build

      - name: Ensure GitHub Release for immutable Production tag
        id: ensure_github_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_TAG_NAME: ${{ needs.create_production_tag.outputs.production_tag_name || needs.production_preflight.outputs.production_tag_name }}
        run: node ./tools/release-cli/ensureProductionGitHubRelease.mts "${PRODUCTION_TAG_NAME}" >> "${GITHUB_OUTPUT}"

  synchronize_webapp_version:
    name: Synchronize WebApp version
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs:
      [
        build_artifact,
        production_preflight,
        deploy_to_production,
        verify_production_runtime,
        create_production_tag,
        publish_production_distribution,
        ensure_github_release,
      ]
    if: >-
      ${{
        always() &&
        needs.production_preflight.result == 'success' &&
        needs.production_preflight.outputs.production_preflight_result == 'ready' &&
        needs.deploy_to_production.result == 'success' &&
        needs.verify_production_runtime.result == 'success' &&
        needs.create_production_tag.result == 'success' &&
        needs.publish_production_distribution.result == 'success' &&
        needs.ensure_github_release.result == 'success'
      }}
    permissions:
      contents: read
    concurrency:
      group: webapp-version-synchronization
      cancel-in-progress: false
      queue: max
    outputs:
      bookkeeping_result: ${{ steps.synchronize.outcome }}
      webapp_version: ${{ steps.synchronize.outputs.version }}
      version_sync_action: ${{ steps.synchronize.outputs.action }}
      version_sync_pr_number: ${{ steps.synchronize.outputs.pull_request_number }}
      version_sync_pr_url: ${{ steps.synchronize.outputs.pull_request_url }}
      version_sync_branch_name: ${{ steps.synchronize.outputs.branch_name }}

    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Add repository Yarn wrapper to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install synchronization tooling dependencies
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: ./bin/yarn install --immutable --mode=skip-build

      - name: Synchronize WebApp version with Production
        id: synchronize
        continue-on-error: true
        env:
          OTTO_THE_BOT_GH_TOKEN: ${{ secrets.OTTO_THE_BOT_GH_TOKEN }}
          PRODUCTION_TAG_NAME: ${{ needs.create_production_tag.outputs.production_tag_name || needs.production_preflight.outputs.production_tag_name }}
        run: |
          set -euo pipefail

          synchronization_output="$(node ./tools/release-cli/webappVersionSynchronization.mts synchronize "${PRODUCTION_TAG_NAME}")"

          jq -e '
            type == "object" and
            (.action | type == "string") and
            (.version | type == "string") and
            (.branch_name | type == "string") and
            (.pull_request_number | type == "number") and
            (.pull_request_url | type == "string")
          ' <<< "${synchronization_output}" > /dev/null

          {
            echo "version=$(jq --raw-output '.version' <<< "${synchronization_output}")"
            echo "action=$(jq --raw-output '.action' <<< "${synchronization_output}")"
            echo "pull_request_number=$(jq --raw-output '.pull_request_number' <<< "${synchronization_output}")"
            echo "pull_request_url=$(jq --raw-output '.pull_request_url' <<< "${synchronization_output}")"
            echo "branch_name=$(jq --raw-output '.branch_name' <<< "${synchronization_output}")"
          } >> "$GITHUB_OUTPUT"

  notify_production_release_success:
    name: Notify successful Production release
    runs-on: ubuntu-24.04
    needs:
      [
        build_artifact,
        create_beta_tag,
        production_approval,
        deploy_to_production,
        verify_production_runtime,
        create_production_tag,
        publish_production_distribution,
        ensure_github_release,
        synchronize_webapp_version,
      ]
    if: >-
      ${{
        always() &&
        needs.deploy_to_production.result == 'success' &&
        needs.verify_production_runtime.result == 'success' &&
        needs.create_production_tag.result == 'success' &&
        needs.publish_production_distribution.result == 'success' &&
        needs.ensure_github_release.result == 'success' &&
        needs.create_production_tag.outputs.production_tag_name != ''
      }}
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout notification action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Announce successful Production release
        uses: ./.github/actions/notify-deployoholics
        with:
          deployoholics-webhook-url: ${{ secrets.WIRE_DEPLOYOHOLICS_WEBHOOK_URL }}
          deployoholics-token: ${{ secrets.WIRE_DEPLOYOHOLICS_TOKEN }}
          text: |
            ✅ WebApp Production release successfully completed ✅

            Release: ${{ needs.build_artifact.outputs.release_version }}
            Branch: ${{ needs.build_artifact.outputs.release_branch }}
            Release commit SHA: ${{ needs.build_artifact.outputs.release_commit_sha }}
            Promoted Beta tag: ${{ needs.create_beta_tag.outputs.beta_tag_name }}
            Production tag: ${{ needs.create_production_tag.outputs.production_tag_name }}
            Production URL: ${{ env.PRODUCTION_WEBAPP_URL }}
            Production approval result: ${{ needs.production_approval.result }}
            Production deployment result: ${{ needs.deploy_to_production.result }}
            Production runtime-verification result: ${{ needs.verify_production_runtime.result }}
            Production distribution result: ${{ needs.publish_production_distribution.result }}
            Docker image tag: ${{ needs.publish_production_distribution.outputs.docker_image_tag }}
            Helm chart version: ${{ needs.publish_production_distribution.outputs.helm_chart_version }}
            wire-builds commit SHA: ${{ needs.publish_production_distribution.outputs.wire_builds_commit_sha }}
            GitHub Release handoff result: ${{ needs.ensure_github_release.result }}
            GitHub Release state: ${{ needs.ensure_github_release.outputs.github_release_state }}
            GitHub Release URL: ${{ needs.ensure_github_release.outputs.github_release_url }}
            GitHub Release handoff: ${{ needs.ensure_github_release.outputs.github_release_action }}
            ${{ needs.ensure_github_release.outputs.github_release_state == 'draft' && 'The GitHub Release is a draft. Review or edit the generated customer-facing changelog and publish it manually.' || 'The existing published GitHub Release was preserved.' }}
            Package synchronization: ${{ needs.synchronize_webapp_version.outputs.bookkeeping_result == 'success' && 'success' || 'requires follow-up' }}
            Synchronized package version: ${{ needs.synchronize_webapp_version.outputs.webapp_version || 'unavailable' }}
            Synchronization action: ${{ needs.synchronize_webapp_version.outputs.version_sync_action || 'unavailable' }}
            Synchronization PR: ${{ needs.synchronize_webapp_version.outputs.version_sync_pr_url || 'unavailable' }}
            Triggering actor: ${{ github.actor }}
            Workflow-run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  summarize_release:
    name: Summarize release
    runs-on: ubuntu-24.04
    needs:
      [
        build_artifact,
        deploy_to_beta,
        create_beta_tag,
        run_e2e,
        production_preflight,
        production_approval,
        deploy_to_production,
        verify_production_runtime,
        create_production_tag,
        publish_production_distribution,
        ensure_github_release,
        synchronize_webapp_version,
      ]
    if: ${{ always() }}
    permissions:
      contents: read

    steps:
      - name: Checkout WebApp release summary renderer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Add repository Yarn wrapper to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install renderer dependencies
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: ./bin/yarn install --immutable

      - name: Add release summary
        env:
          ARTIFACT_CHECKSUM: ${{ needs.build_artifact.outputs.artifact_checksum }}
          ARTIFACT_BUILT_AT: ${{ needs.build_artifact.outputs.artifact_built_at }}
          ARTIFACT_ASSET_VERSION: ${{ needs.build_artifact.outputs.artifact_asset_version }}
          ARTIFACT_NAME: ${{ needs.build_artifact.outputs.artifact_name }}
          ARTIFACT_VERSION: ${{ needs.build_artifact.outputs.artifact_version }}
          BETA_RESULT: ${{ needs.deploy_to_beta.result }}
          BETA_ELASTIC_BEANSTALK_ENVIRONMENT_NAME: ${{ env.BETA_ELASTIC_BEANSTALK_ENVIRONMENT_NAME }}
          BETA_RUNTIME_BACKEND_REST: ${{ env.BETA_RUNTIME_BACKEND_REST }}
          BETA_RUNTIME_BACKEND_WS: ${{ env.BETA_RUNTIME_BACKEND_WS }}
          BETA_RUNTIME_VERIFICATION_RESULT: ${{ needs.deploy_to_beta.outputs.runtime_verification_result }}
          BETA_TAG_CREATION_RESULT: ${{ needs.create_beta_tag.result }}
          BETA_TAG_NAME: ${{ needs.create_beta_tag.outputs.beta_tag_name }}
          BETA_WEBAPP_URL: ${{ env.BETA_WEBAPP_URL }}
          CHART_REPOSITORY_URL: ${{ env.CHART_REPOSITORY_URL }}
          DOCKER_REPOSITORY: ${{ env.DOCKER_REPOSITORY }}
          E2E_RUNTIME_BACKEND_REST: ${{ env.E2E_RUNTIME_BACKEND_REST }}
          E2E_RUNTIME_BACKEND_WS: ${{ env.E2E_RUNTIME_BACKEND_WS }}
          E2E_ELASTIC_BEANSTALK_ENVIRONMENT_NAME: ${{ env.E2E_ELASTIC_BEANSTALK_ENVIRONMENT_NAME }}
          E2E_REPORT_URL: ${{ needs.run_e2e.outputs.reportUrl }}
          E2E_RESULT: ${{ needs.run_e2e.result }}
          E2E_WEBAPP_URL: ${{ env.E2E_WEBAPP_URL }}
          PRODUCTION_APPROVAL_RESULT: ${{ needs.production_approval.result }}
          PRODUCTION_CURRENT_BETA_VERIFICATION_RESULT: ${{ needs.deploy_to_production.outputs.current_beta_verification_result }}
          PRODUCTION_DEPLOYMENT_RESULT: ${{ needs.deploy_to_production.result }}
          PRODUCTION_DISTRIBUTION_JOB_RESULT: ${{ needs.publish_production_distribution.result }}
          PRODUCTION_DISTRIBUTION_RESULT: ${{ needs.publish_production_distribution.outputs.distribution_result }}
          GITHUB_RELEASE_JOB_RESULT: ${{ needs.ensure_github_release.result }}
          GITHUB_RELEASE_ACTION: ${{ needs.ensure_github_release.outputs.github_release_action }}
          GITHUB_RELEASE_STATE: ${{ needs.ensure_github_release.outputs.github_release_state }}
          GITHUB_RELEASE_TAG_NAME: ${{ needs.ensure_github_release.outputs.production_tag_name }}
          GITHUB_RELEASE_URL: ${{ needs.ensure_github_release.outputs.github_release_url }}
          WEBAPP_VERSION_SYNC_ACTION: ${{ needs.synchronize_webapp_version.outputs.version_sync_action }}
          WEBAPP_VERSION_SYNC_BRANCH_NAME: ${{ needs.synchronize_webapp_version.outputs.version_sync_branch_name }}
          WEBAPP_VERSION_SYNC_JOB_RESULT: ${{ needs.synchronize_webapp_version.outputs.bookkeeping_result }}
          WEBAPP_VERSION_SYNC_PR_NUMBER: ${{ needs.synchronize_webapp_version.outputs.version_sync_pr_number }}
          WEBAPP_VERSION_SYNC_PR_URL: ${{ needs.synchronize_webapp_version.outputs.version_sync_pr_url }}
          WEBAPP_VERSION: ${{ needs.synchronize_webapp_version.outputs.webapp_version }}
          PRODUCTION_DEPLOYMENT_REQUIRED: ${{ needs.production_preflight.outputs.should_deploy }}
          PRODUCTION_ENVIRONMENT_NAME: ${{ env.PRODUCTION_ENVIRONMENT_NAME }}
          PRODUCTION_PREFLIGHT_JOB_RESULT: ${{ needs.production_preflight.result }}
          PRODUCTION_PREFLIGHT_RESULT: ${{ needs.production_preflight.outputs.production_preflight_result }}
          PRODUCTION_RUNTIME_VERIFICATION_RESULT: ${{ needs.verify_production_runtime.result }}
          PRODUCTION_RUNTIME_BACKEND_REST: ${{ env.PRODUCTION_RUNTIME_BACKEND_REST }}
          PRODUCTION_RUNTIME_BACKEND_WS: ${{ env.PRODUCTION_RUNTIME_BACKEND_WS }}
          PRODUCTION_WEBAPP_URL: ${{ env.PRODUCTION_WEBAPP_URL }}
          PRODUCTION_DOCKER_IMAGE_TAG: ${{ needs.publish_production_distribution.outputs.docker_image_tag }}
          PRODUCTION_HELM_CHART_VERSION: ${{ needs.publish_production_distribution.outputs.helm_chart_version }}
          PRODUCTION_SKIPPED_REASON: ${{ needs.production_preflight.outputs.production_skipped_reason }}
          PRODUCTION_TAG_CREATION_RESULT: ${{ needs.create_production_tag.result }}
          CREATED_PRODUCTION_TAG_NAME: ${{ needs.create_production_tag.outputs.production_tag_name }}
          PLANNED_PRODUCTION_TAG_NAME: ${{ needs.production_preflight.outputs.production_tag_name }}
          PRODUCTION_WIRE_BUILDS_COMMIT_SHA: ${{ needs.publish_production_distribution.outputs.wire_builds_commit_sha }}
          RELEASE_BRANCH: ${{ needs.build_artifact.outputs.release_branch }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_OPERATION: ${{ needs.build_artifact.outputs.operation }}
          RELEASE_BRANCH_ACTION: ${{ needs.build_artifact.outputs.release_branch_action }}
          RELEASE_COMMIT_SHA: ${{ needs.build_artifact.outputs.release_commit_sha }}
          RELEASE_VERSION: ${{ needs.build_artifact.outputs.release_version }}
          RELEASE_REASON: ${{ inputs.reason }}
          TESTINY_RUN_NAME: Release ${{ needs.build_artifact.outputs.release_version }} ${{ needs.create_beta_tag.outputs.beta_tag_name }}
        run: node tools/release-summary/renderWebappReleaseSummary.ts >> "$GITHUB_STEP_SUMMARY"

  notify_release_failure:
    name: Notify failed release
    runs-on: ubuntu-24.04
    needs:
      [
        prepare_release,
        build_artifact,
        deploy_to_beta,
        create_beta_tag,
        run_e2e,
        production_preflight,
        production_approval,
        deploy_to_production,
        verify_production_runtime,
        create_production_tag,
        publish_production_distribution,
        ensure_github_release,
      ]
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') }}
    permissions:
      contents: read

    steps:
      - name: Checkout notification action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Announce release failure
        uses: ./.github/actions/notify-deployoholics
        with:
          deployoholics-webhook-url: ${{ secrets.WIRE_DEPLOYOHOLICS_WEBHOOK_URL }}
          deployoholics-token: ${{ secrets.WIRE_DEPLOYOHOLICS_TOKEN }}
          text: |
            ❌ WebApp release failed ❌

            Release: ${{ needs.build_artifact.outputs.release_version || 'unavailable' }}
            Branch: ${{ needs.build_artifact.outputs.release_branch || needs.prepare_release.outputs.release_branch || 'unavailable' }}
            Triggered by: ${{ github.actor }}

            Release preparation: ${{ needs.prepare_release.result }}
            Build: ${{ needs.build_artifact.result }}
            Beta deployment: ${{ needs.deploy_to_beta.result }}
            Beta tag: ${{ needs.create_beta_tag.result }}
            E2E system gate: ${{ needs.run_e2e.result }}
            Production preflight: ${{ needs.production_preflight.result }}
            Production approval: ${{ needs.production_approval.result }}
            Current Beta verification: ${{ needs.deploy_to_production.outputs.current_beta_verification_result || 'not run' }}
            Production deployment: ${{ needs.deploy_to_production.result }}
            Production runtime verification: ${{ needs.verify_production_runtime.result }}
            Production tag: ${{ needs.create_production_tag.result }}
            Production distribution: ${{ needs.publish_production_distribution.result }}
            GitHub Release handoff: ${{ needs.ensure_github_release.result }}
            GitHub Release tag: ${{ needs.ensure_github_release.outputs.production_tag_name || needs.create_production_tag.outputs.production_tag_name || needs.production_preflight.outputs.production_tag_name || 'unavailable' }}
            GitHub Release URL: ${{ needs.ensure_github_release.outputs.github_release_url || 'unavailable' }}
            GitHub Release state: ${{ needs.ensure_github_release.outputs.github_release_state || 'unavailable' }}
            GitHub Release action: ${{ needs.ensure_github_release.outputs.github_release_action || 'unavailable' }}
            Production runtime verification result: ${{ needs.verify_production_runtime.result }}
            Expected Production webapp version: ${{ needs.build_artifact.outputs.artifact_version || 'unavailable' }}
            Expected Production release commit: ${{ needs.build_artifact.outputs.release_commit_sha || 'unavailable' }}
            Production tag name: ${{ needs.create_production_tag.outputs.production_tag_name || needs.production_preflight.outputs.production_tag_name || 'unavailable' }}
            Docker image tag: ${{ needs.publish_production_distribution.outputs.docker_image_tag || 'unavailable' }}
            Helm chart version: ${{ needs.publish_production_distribution.outputs.helm_chart_version || 'unavailable' }}
            wire-builds result: ${{ needs.publish_production_distribution.outputs.wire_builds_commit_sha || 'publication failed or unavailable' }}

            Playwright report: ${{ needs.run_e2e.outputs.reportUrl || 'unavailable' }}
            Source workflow URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ${{ needs.production_preflight.outputs.production_preflight_result == 'already_tagged' && needs.ensure_github_release.result == 'failure' && 'Production was already tagged; deployment was not repeated.' || needs.create_production_tag.result == 'success' && (needs.publish_production_distribution.result == 'failure' || needs.ensure_github_release.result == 'failure') && 'Hosted Production deployment and verification succeeded.' || 'Production was blocked because a release gate failed.' }}
            ${{ needs.production_preflight.outputs.production_preflight_result == 'already_tagged' && needs.ensure_github_release.result == 'failure' && 'The existing Production tag remains unchanged.' || needs.create_production_tag.result == 'success' && (needs.publish_production_distribution.result == 'failure' || needs.ensure_github_release.result == 'failure') && 'The Production tag exists.' || 'Production tag creation was blocked by the failed release gate.' }}
            ${{ needs.publish_production_distribution.result == 'failure' && needs.create_production_tag.result == 'success' && 'Docker, Helm, or wire-builds publication failed.' || needs.ensure_github_release.result == 'failure' && (needs.create_production_tag.result == 'success' || needs.production_preflight.outputs.production_preflight_result == 'already_tagged') && 'GitHub Release draft creation or verification failed.' || '' }}
            ${{ needs.publish_production_distribution.result == 'failure' && needs.create_production_tag.result == 'success' && 'The release is incomplete for on-premises distribution.' || needs.ensure_github_release.result == 'failure' && (needs.create_production_tag.result == 'success' || needs.production_preflight.outputs.production_preflight_result == 'already_tagged') && 'The automated release lifecycle is incomplete until the GitHub Release handoff succeeds.' || '' }}
            ${{ needs.create_production_tag.result == 'success' && (needs.publish_production_distribution.result == 'failure' || needs.ensure_github_release.result == 'failure') && 'No Production tag was moved or deleted.' || '' }}
