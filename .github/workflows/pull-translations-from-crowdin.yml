---
name: Pull translations from Crowdin

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-pull-main
  cancel-in-progress: true

jobs:
  pull_from_crowdin:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm clean-install

      - name: Download translations and create PR
        uses: crowdin/github-action@7ca9c452bfe9197d3bb7fa83a4d7e2b0c9ae835d
        env:
          GITHUB_TOKEN: ${{ secrets.OTTO_THE_BOT_GH_TOKEN }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.WEBTEAM_CROWDIN_TOKEN }}
          INPUT_DEBUG_MODE: false
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          push_translations: true
          create_pull_request: true
          localization_branch_name: 'translations'
          pull_request_base_branch_name: 'main'
          pull_request_title: 'Update translations'
          pull_request_labels: 'semver:patch'
          commit_message: 'Update translations'
          github_user_name: otto-the-bot
          github_user_email: webapp+otto@wire.com
          config: crowdin.yaml

      - name: Validate downloaded translation markers
        run: npx just translate-validate
