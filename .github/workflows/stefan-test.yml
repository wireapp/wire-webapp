name: Stefan Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set branch name and generate versions
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "BRANCH_NAME=${BRANCH//\//-}" >> $GITHUB_ENV

          CHART_VERSION="0.0.0-$(date +%s)"
          IMAGE_TAG="v1.0.0-$(openssl rand -hex 4)"
          echo "CHART_VERSION=$CHART_VERSION" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

          CHART_REPO_BASE="quay.io/wire/charts/dev"
          CHART_REPO="$CHART_REPO_BASE/webapp"
          echo "CHART_REPO_BASE=$CHART_REPO_BASE" >> $GITHUB_ENV
          echo "CHART_REPO=$CHART_REPO" >> $GITHUB_ENV

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Publish Helm chart
        shell: bash
        run: |
          set -eo pipefail

          chart_patched="$(yq -Mr ".version = \"${{ env.CHART_VERSION }}\" | .appVersion = \"${{ env.IMAGE_TAG }}\"" ./charts/webapp/Chart.yaml)"
          echo "$chart_patched" > ./charts/webapp/Chart.yaml

          helm package ./charts/webapp

          echo "Helm version:"
          helm version

          echo "Logging in to Quay with Helm..."
          echo "${{ secrets.WEBTEAM_QUAY_PASSWORD }}" | helm registry login -u "${{ secrets.WEBTEAM_QUAY_USERNAME }}" --password-stdin quay.io

          echo "Attempting to push chart..."
          helm_output=$(helm push ./webapp-*.tgz oci://${{ env.CHART_REPO_BASE }} 2>&1) || {
            echo "Helm push failed with exit code $?"
            echo "Output: $helm_output"
            exit 1
          }
          echo "$helm_output"

          digest=$(echo "$helm_output" | grep -oP 'sha256:\K[a-f0-9]{64}' | head -1)
          echo "CHART_DIGEST=sha256:$digest" >> $GITHUB_ENV
          echo "Extracted digest: sha256:$digest"

      - name: Create build artifact
        run: |
          cat > build.json <<EOF
          {
            "branch": "${{ env.BRANCH_NAME }}",
            "commit": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}",
            "tag": "${{ env.IMAGE_TAG }}",
            "digest": "${{ env.CHART_DIGEST }}",
            "repository": "${{ env.CHART_REPO }}"
          }
          EOF
          cat build.json

      - name: Login to Quay
        run: echo "${{ secrets.WEBTEAM_QUAY_PASSWORD }}" | oras login -u "${{ secrets.WEBTEAM_QUAY_USERNAME }}" --password-stdin quay.io

      - name: Publish to Quay with ORAS
        run: |
          oras push \
            quay.io/wire/release-streams/webapp:${{ env.BRANCH_NAME }} \
            build.json:application/vnd.wire.webapp.build+json

