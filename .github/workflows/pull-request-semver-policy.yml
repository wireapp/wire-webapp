---
name: Pull request SemVer policy

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]
  merge_group:
    branches: [main, release/*, maintenance/*]

permissions: {}

concurrency:
  group: pull-request-semver-policy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pull-request-semver-policy:
    name: Pull request SemVer policy
    runs-on: ubuntu-26.04
    permissions:
      contents: read # required for checkout; labels come from the event payload
    steps:
      - name: Record merge queue validation
        if: ${{ github.event_name == 'merge_group' }}
        run: echo 'PR-label validation is not applicable on merge queue; validation ran before queue entry.'

      - name: Checkout repository
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install policy tooling dependencies
        if: ${{ github.event_name == 'pull_request' }}
        # Skip lifecycle scripts because policy analysis does not need WebApp configuration.
        run: npm clean-install --ignore-scripts && npx just apply-patches

      - name: Validate pull request release impact
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          PULL_REQUEST_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node ./tools/releaseCli/pullRequestSemverPolicy.mts
