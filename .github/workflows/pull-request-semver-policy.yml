---
name: Pull request SemVer policy

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]
  merge_group:
    branches: [main, release/*, maintenance/*]

permissions: {}

concurrency:
  group: pull-request-semver-policy-${{ github.ref }}
  # Only new commits supersede running validation; metadata bursts should not
  # repeatedly discard dependency installation.
  # GitHub still replaces pending runs. Read current PR state below because scheduling
  # order does not guarantee that the surviving run has the newest event payload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  pull-request-semver-policy:
    name: Pull request SemVer policy
    runs-on: ubuntu-26.04
    permissions:
      contents: read # required for checkout
      pull-requests: read # read current labels and target branch immediately before validation
    steps:
      - name: Record merge queue validation
        if: ${{ github.event_name == 'merge_group' }}
        run: echo 'PR-label validation is not applicable on merge queue; validation ran before queue entry.'

      - name: Checkout repository
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install policy tooling dependencies
        if: ${{ github.event_name == 'pull_request' }}
        # Skip lifecycle scripts because policy analysis does not need WebApp configuration.
        run: npm clean-install --ignore-scripts && npx just apply-patches

      - name: Read current pull request policy input
        id: policy_input
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pull_request_json="$(gh api "repos/${GH_REPO}/pulls/${PULL_REQUEST_NUMBER}")"
          target_branch_json="$(jq -ce '.base.ref | select(type == "string")' <<< "$pull_request_json")"
          pull_request_labels_json="$(jq -ce '.labels | map(.name)' <<< "$pull_request_json")"
          printf 'target_branch_json=%s\n' "$target_branch_json" >> "$GITHUB_OUTPUT"
          printf 'pull_request_labels_json=%s\n' "$pull_request_labels_json" >> "$GITHUB_OUTPUT"

      - name: Validate pull request release impact
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TARGET_BRANCH: ${{ fromJSON(steps.policy_input.outputs.target_branch_json) }}
          PULL_REQUEST_LABELS_JSON: ${{ steps.policy_input.outputs.pull_request_labels_json }}
        run: node ./tools/releaseCli/pullRequestSemverPolicy.mts
