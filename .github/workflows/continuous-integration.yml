---
name: Continuous integration

on:
  pull_request:
    # we want to run the continuous integration on every pull request targetting those branches
    branches: [main, release/*, maintenance/*]

  merge_group:
    branches: [main, release/*, maintenance/*]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Keep Nx task caching disabled in pull_request and merge_group runs because
# repository-controlled code is untrusted and could poison task results (CVE-2025-36852, CREEP).
env:
  NX_SKIP_NX_CACHE: 'true'

jobs:
  workflow-security:
    runs-on: ubuntu-24.04
    name: Workflow security analysis
    permissions:
      actions: read # required by zizmor online audits in private repositories
      contents: read # required for actions/checkout to read the workflow source
      security-events: write # required by zizmor-action to upload SARIF to code scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run zizmor
        id: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows/continuous-integration.yml
          version: 1.25.2
          persona: pedantic
          min-severity: informational
          min-confidence: low
          config: .github/zizmor.yml

      - name: Fail if zizmor reported findings
        env:
          sarifFilePath: ${{ steps.zizmor.outputs.output-file }}
        run: |
          findingsCount="$(jq '[.runs[].results[]] | length' "$sarifFilePath")"
          echo "zizmor findings: $findingsCount"
          test "$findingsCount" -eq 0

  generated-artifacts:
    runs-on: ubuntu-24.04
    name: generated artifacts check
    permissions:
      contents: read

    steps:
      # Do not set ref to github.event.pull_request.head.sha. pull request continuous integration must use the default
      # merge commit so the workflow and checked-out files stay aligned.
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Verify sparse runtime validation entry point
        run: bash ./tools/runtimeVerification/verifySparseRuntimeValidation.sh

      - name: Install dependencies
        run: npm clean-install

      - name: Verify deployment CLI from clean install
        run: |
          rm -rf libraries/config/lib
          published_charts_path="$(mktemp)"
          printf '%s\n' '[]' > "${published_charts_path}"

          helm_action="$(
            ./tools/productionDistribution/runProductionDistributionCli.sh \
              select-helm-chart \
              --charts-path "${published_charts_path}" \
              --image-tag "dev-test-image"
          )"

          test "${helm_action}" = 'publish'
          test -f libraries/config/lib/index.js
          test -f libraries/config/lib/index.d.ts

      - name: Verify generated i18n artifacts are committed
        run: |
          npm exec -- nx run webapp:translate-merge

          if ! test -z "$(git status --porcelain)"; then
            echo "Repository is not clean after generation. Run generation locally and commit the changes."
            git status
            exit 1
          fi

      - name: Validate translation markers
        run: npm exec -- nx run webapp:validate-translations

  build-libraries:
    runs-on: ubuntu-24.04
    name: build libraries
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm clean-install

      - name: Build libraries
        run: npm exec -- nx run-many -t build --projects=tag:type:lib

  rspack-build:
    runs-on: ubuntu-24.04
    name: Rspack production build
    permissions:
      contents: read
    container:
      image: quay.io/wire/mirror-images/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm clean-install

      - name: Build internal webapp
        run: npm exec -- nx run webapp:build

      - name: Build and package public webapp with Rspack
        id: public_rspack_package
        env:
          WIRE_WEBAPP_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short_commit_sha="${WIRE_WEBAPP_BUILD_COMMIT::7}"
          expected_version="dev-${short_commit_sha}"
          WIRE_WEBAPP_BUILD_VERSION="${expected_version}" \
            npm exec -- nx run server:package-public
          echo "expected_version=${expected_version}" >> "$GITHUB_OUTPUT"

      - name: Install unzip for artifact verification
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends unzip
          rm -rf /var/lib/apt/lists/*

      - name: Verify public Rspack deployment package
        env:
          BUILD_ARTIFACT_PATH: apps/server/dist/s3/ebs.zip
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_VERSION: ${{ steps.public_rspack_package.outputs.expected_version }}
        run: |
          set -euo pipefail

          test -f "$BUILD_ARTIFACT_PATH"
          unzip -tq "$BUILD_ARTIFACT_PATH"
          node ./tools/buildArtifact/validateBuildArtifact.mts

          archive_entries="$(unzip -Z1 "$BUILD_ARTIFACT_PATH")"
          required_entry_scripts=(
            static/min/app.js
            static/min/auth.js
            static/min/checkBrowser.js
            static/min/runtime.js
            static/min/vendor.js
            static/min/dexie.js
            static/min/pdf.worker.mjs
            static/min/worker.js
          )

          for entry_script_path in "${required_entry_scripts[@]}"; do
            if ! grep -Fqx -- "$entry_script_path" <<< "$archive_entries"; then
              echo "Public Rspack deployment package is missing required entry script: $entry_script_path" >&2
              exit 1
            fi
          done

          public_rspack_runtime="$(unzip -p "$BUILD_ARTIFACT_PATH" static/min/runtime.js)"
          if ! grep -Fq 'rspackChunk_wireapp_webapp' <<< "$public_rspack_runtime"; then
            echo "Public deployment package does not contain the Rspack runtime fingerprint." >&2
            exit 1
          fi

          if grep -Fq 'webpackChunk_wireapp_webapp' <<< "$public_rspack_runtime"; then
            echo "Public deployment package contains the Webpack runtime fingerprint." >&2
            exit 1
          fi

      - name: Run Rspack browser smoke tests
        run: npm exec -- nx run webapp:smoke-rspack

      - name: Upload Rspack smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rspack-browser-smoke-diagnostics
          path: |
            apps/webapp/playwright-report/rspack-smoke/
            apps/webapp/test-results/rspack-smoke/
          if-no-files-found: ignore
          retention-days: 3

  type-check:
    runs-on: ubuntu-24.04
    name: type check
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm clean-install

      - name: Type check
        run: npm run type-check

  lint-file-names:
    runs-on: ubuntu-24.04
    name: lint file names
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm clean-install

      - name: Lint file names
        run: npm run lint:fileNames

  lint:
    runs-on: ubuntu-24.04
    name: lint
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          # Keep this shallow. Nx gets the base branch explicitly in the next step.

      - name: Fetch base branch for Nx checks
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin \
            "${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "${BASE_REF}:${BASE_REF}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm clean-install

      - name: Check code duplication
        id: duplication
        run: npm run lint:duplication

      - name: Upload duplication report
        if: ${{ !cancelled() && steps.duplication.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duplication-report
          path: target/reports/duplication/
          if-no-files-found: error
          retention-days: 3

      - name: Build libraries for lint import resolution
        run: npm exec -- nx run-many -t build --projects=tag:type:lib

      - name: Lint affected projects (ESLint)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm exec -- nx affected -t lint --base="origin/${BASE_REF}"

      - name: Check formatting (Prettier)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run lint:format

      - name: Stylelint
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run stylelint

      - name: Lint all projects (ESLint)
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run lint:projects

      - name: Check formatting (Prettier)
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run lint:format

      - name: Stylelint
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run stylelint

  unit-tests:
    runs-on: ubuntu-24.04
    name: unit tests
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm clean-install

      - name: Test
        run: ./tools/ci/runWithNetworkIsolation.sh npm exec -- nx run-many -t test --all --configuration=ci --detectOpenHandles=false

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/webapp/coverage
            apps/server/coverage
            coverage/libraries/core
            coverage/libraries/api-client

  public-production-package:
    runs-on: ubuntu-24.04
    name: Public production package verification
    if: ${{ github.event_name == 'pull_request' }}
    needs:
      - generated-artifacts
      - build-libraries
      - type-check
      - lint-file-names
      - lint
      - unit-tests
    permissions:
      contents: read

    steps:
      - name: Checkout (pull_request)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm clean-install

      - name: Build and verify public production package
        env:
          WIRE_WEBAPP_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short_commit_sha="${WIRE_WEBAPP_BUILD_COMMIT::7}"
          expected_version="dev-${short_commit_sha}"
          WIRE_WEBAPP_BUILD_VERSION="${expected_version}" \
            npm run build:prod:public

          BUILD_ARTIFACT_PATH=apps/server/dist/s3/ebs.zip \
          EXPECTED_COMMIT="${WIRE_WEBAPP_BUILD_COMMIT}" \
          EXPECTED_VERSION="${expected_version}" \
            node ./tools/buildArtifact/validateBuildArtifact.mts

      - name: Build and smoke-test sparse production Docker context
        env:
          DOCKER_IMAGE_TAG: wire-webapp-production-ci:${{ github.run_id }}-${{ github.run_attempt }}
          DISTRIBUTION_CONTEXT_PATH: ${{ runner.temp }}/production-docker-context
          EXPECTED_VERSION: ${{ steps.public_rspack_package.outputs.expected_version }}
          WIRE_WEBAPP_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          mkdir -p \
            "${DISTRIBUTION_CONTEXT_PATH}/apps/server" \
            "${DISTRIBUTION_CONTEXT_PATH}/libraries/config"

          cp -a package.json package-lock.json .npmrc run.sh .env.defaults "${DISTRIBUTION_CONTEXT_PATH}/"
          cp -a apps/server/Dockerfile apps/server/package.json apps/server/dist "${DISTRIBUTION_CONTEXT_PATH}/apps/server/"
          cp -a libraries/config/package.json libraries/config/lib "${DISTRIBUTION_CONTEXT_PATH}/libraries/config/"

          cloud_artifact_checksum="$(sha256sum apps/server/dist/s3/ebs.zip | awk '{print $1}')"
          jq -n \
            --arg release_version "${EXPECTED_VERSION}" \
            --arg release_commit_sha "${WIRE_WEBAPP_BUILD_COMMIT}" \
            --arg artifact_version "${EXPECTED_VERSION}" \
            --arg cloud_artifact_checksum "${cloud_artifact_checksum}" \
            --arg source_run_id "${GITHUB_RUN_ID}" \
            --arg source_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{
              productionTag: null,
              releaseIdentifier: $release_version,
              releaseCommitSha: $release_commit_sha,
              artifactVersion: $artifact_version,
              cloudArtifactChecksum: $cloud_artifact_checksum,
              sourceRunId: $source_run_id,
              sourceRunAttempt: $source_run_attempt
            }' > "${DISTRIBUTION_CONTEXT_PATH}/distribution-manifest.json"

          docker build \
            "${DISTRIBUTION_CONTEXT_PATH}" \
            --file "${DISTRIBUTION_CONTEXT_PATH}/apps/server/Dockerfile" \
            --tag "${DOCKER_IMAGE_TAG}"

          docker run --rm --entrypoint sh "${DOCKER_IMAGE_TAG}" -c '
            test -s /dist/index.js &&
            test -s /dist/version.json &&
            test -d /dist/static &&
            test -s /app/libraries/config/lib/index.js &&
            test -s /app/run.sh &&
            test -s /dist/.env.defaults &&
            grep -q "^BACKEND_NAME=" /dist/.env.defaults &&
            grep -q "^BRAND_NAME=" /dist/.env.defaults &&
            grep -q "^URL_ACCOUNT_BASE=" /dist/.env.defaults &&
            grep -q "^BACKEND_REST=" /dist/.env.defaults &&
            grep -q "^BACKEND_WS=" /dist/.env.defaults &&
            test ! -e /app/node_modules/jest &&
            test ! -e /app/node_modules/nx &&
            test ! -e /app/node_modules/typescript &&
            node -e "require(\"@wireapp/config\")"
          '
